<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Surface panel matching the dashboard's surface-container-high. -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#1c2b3c"/>
  <!-- Subtle outline + tertiary glow ring for the institutional terminal feel. -->
  <rect x="1" y="1" width="62" height="62" rx="11" fill="none" stroke="#7bd0ff" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- Bottom-right "live" pulse dot in tertiary blue. -->
  <circle cx="50" cy="50" r="3" fill="#7bd0ff"/>
  <!-- Lowercase greek alpha — brand mark. Bold + system sans for crisp 16px rendering. -->
  <text x="32" y="46" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif"
        font-size="42" font-weight="700" fill="#bee0ff">α</text>
</svg>
